<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cimega Secure Call</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040d1a;
      --card-bg: rgba(6, 20, 40, 0.7);
      --border-color: rgba(0, 229, 255, 0.2);
      --cyan: #00e5ff;
      --magenta: #ff00ff;
      --red: #ff3366;
      --green: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Background futuristic grid */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
      pointer-events: none;
    }

    /* Header */
    #callHeader {
      height: 60px;
      background: rgba(4, 20, 45, 0.9);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .call-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px var(--red); }
      100% { transform: scale(0.9); opacity: 0.5; }
    }

    /* Calling/Ringing State overlay */
    #statusOverlay {
      position: absolute;
      top: 60px; left: 0; right: 0; bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(4, 13, 26, 0.85);
      z-index: 9;
      backdrop-filter: blur(15px);
      transition: opacity 0.5s ease;
    }

    .avatar-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 20px;
    }

    .caller-name {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .call-status-text {
      font-size: 12px;
      color: var(--cyan);
      letter-spacing: 3px;
      font-family: 'Orbitron', sans-serif;
    }

    /* Video Stream Grid (Max 32 Users) */
    #videoGrid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      grid-auto-rows: minmax(180px, 1fr);
      gap: 15px;
      padding: 15px;
      overflow-y: auto;
      z-index: 2;
      align-content: center;
    }

    .video-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect */
    }

    .video-label {
      position: absolute;
      bottom: 10px; left: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 3;
    }

    /* Local Video Preview (Mini float window) */
    #localVideoBox {
      position: absolute;
      bottom: 95px; right: 20px;
      width: 160px;
      height: 120px;
      background: #000;
      border: 2px solid var(--cyan);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 5;
      transition: all 0.3s;
    }

    #localVideoBox:hover {
      transform: scale(1.05);
    }

    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Controls Bar */
    #controlsBar {
      height: 80px;
      background: rgba(4, 20, 45, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .btn-control {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-control:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 15px var(--cyan);
      transform: scale(1.08);
    }

    .btn-control.off {
      background: var(--red) !important;
      color: #fff !important;
      border-color: var(--red) !important;
      box-shadow: 0 0 15px var(--red) !important;
    }

    .btn-control.end-call {
      background: var(--red);
      border-color: var(--red);
    }

    .btn-control.end-call:hover {
      background: #d32f2f;
      color: #fff;
      box-shadow: 0 0 20px var(--red);
    }

    .btn-control.accept-call {
      background: var(--green);
      border-color: var(--green);
    }

    .btn-control.accept-call:hover {
      background: #00c853;
      color: #fff;
      box-shadow: 0 0 20px var(--green);
    }

    /* Ringtone hidden audios */
    #ringtoneOutgoing, #ringtoneIncoming {
      display: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="callHeader">
    <div class="call-title">
      <div class="pulse-dot"></div>
      <span id="callTypeTitle">SECURE P2P VIDEO CALL</span>
    </div>
    <div style="font-size: 11px; font-family: 'Orbitron'; color: var(--cyan); font-weight: bold;" id="callDuration">00:00</div>
  </div>

  <!-- STATUS/RINGING OVERLAY -->
  <div id="statusOverlay">
    <div class="avatar-large" id="statusAvatar">👤</div>
    <div class="caller-name" id="statusTargetName">Menghubungkan...</div>
    <div class="call-status-text" id="statusMessage">MENGHUBUNGKAN...</div>
  </div>

  <!-- PARTICIPANT GRID -->
  <div id="videoGrid"></div>

  <!-- FLOAT LOCAL VIDEO PREVIEW -->
  <div id="localVideoBox">
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="video-label" style="bottom: 5px; left: 5px; font-size: 9px; padding: 2px 6px;">Anda</div>
  </div>

  <!-- CONTROLS BAR -->
  <div id="controlsBar">
    <button class="btn-control" id="btnMute" onclick="toggleMute()" title="Bisukan Mikrofon">🎤</button>
    <button class="btn-control" id="btnVideo" onclick="toggleVideo()" title="Matikan Kamera">📷</button>
    <button class="btn-control" id="btnScreen" onclick="toggleScreenShare()" title="Bagikan Layar">🖥️</button>
    
    <!-- Hang up button -->
    <button class="btn-control end-call" id="btnEndCall" onclick="endCall()" title="Akhiri Panggilan">📞</button>
  </div>

  <!-- SCREEN SHARE PICKER MODAL -->
  <div id="screenPickerModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(4, 13, 26, 0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(15px); padding:20px;">
    <h2 style="font-family:'Orbitron'; font-size:18px; color:var(--cyan); margin-bottom:20px; letter-spacing:2px; text-transform:uppercase;">Pilih Layar / Jendela</h2>
    <div id="screenSourcesList" style="display:flex; flex-wrap:wrap; gap:15px; justify-content:center; max-width:800px; max-height:400px; overflow-y:auto; padding:10px; border:1px solid var(--border-color); border-radius:12px; background:rgba(0,0,0,0.2); width:100%;"></div>
    <div style="margin-top:20px; display:flex; gap:15px;">
      <button onclick="closeScreenPicker()" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px 20px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700;">BATAL</button>
    </div>
  </div>

  <!-- RINGTONE ASSETS -->
  <!-- Ringtone di-load dari sound generator berbasis Web Audio API di Javascript agar tidak ketergantungan file musik tambahan -->
  
  <!-- SCRIPT LAUNCHER -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js" type="module"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js" type="module"></script>
  <script src="call.js" type="module"></script>

</body>
</html>
