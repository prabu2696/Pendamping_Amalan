<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cimega Secure Call</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #7c3aed;
      --blue: #4f46e5;
      --cyan: #0ea5e9;
      --dark: #08090d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --danger: #f43f5e;
      --warn: #f59e0b;
      --gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    body {
      background: transparent;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Space Background System */
    .space-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #030206;
      overflow: hidden;
      pointer-events: none;
    }

    .sphere {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      mix-blend-mode: screen;
      animation: drift 25s infinite alternate ease-in-out;
    }

    .sphere.s1 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(124,58,237,0.8) 0%, rgba(79,70,229,0) 70%);
      top: -10%;
      left: -10%;
      animation-duration: 28s;
    }

    .sphere.s2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(14,165,233,0.8) 0%, rgba(6,182,212,0) 70%);
      bottom: -15%;
      right: -10%;
      animation-duration: 32s;
    }

    .sphere.s3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(244,63,94,0.7) 0%, rgba(225,29,72,0) 70%);
      top: 40%;
      left: 50%;
      animation-duration: 24s;
    }

    .sphere.s4 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(79,70,229,0.7) 0%, rgba(124,58,237,0) 70%);
      bottom: 20%;
      left: -15%;
      animation-duration: 30s;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { transform: translate(60px, 40px) rotate(360deg) scale(1.1); }
    }

    /* Header */
    #callHeader {
      height: 65px;
      background: rgba(10, 11, 16, 0.45);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
      backdrop-filter: blur(6px) saturate(180%);
      -webkit-backdrop-filter: blur(6px) saturate(180%);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
    }

    .call-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--danger);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px var(--danger); }
      100% { transform: scale(0.9); opacity: 0.5; }
    }

    /* Calling/Ringing State overlay */
    #statusOverlay {
      position: absolute;
      top: 65px; left: 0; right: 0; bottom: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 2, 6, 0.65);
      z-index: 9;
      backdrop-filter: blur(6px) saturate(180%);
      -webkit-backdrop-filter: blur(6px) saturate(180%);
      transition: opacity 0.5s ease;
    }

    .avatar-large {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 24px;
    }

    .caller-name {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .call-status-text {
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 2px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
    }

    /* Video Stream Grid (Max 32 Users) */
    #videoGrid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      grid-auto-rows: minmax(180px, 1fr);
      gap: 20px;
      padding: 24px;
      overflow-y: auto;
      z-index: 2;
      align-content: center;
    }

    .video-box {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px) saturate(180%);
      -webkit-backdrop-filter: blur(6px) saturate(180%);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .video-label {
      position: absolute;
      bottom: 12px; left: 12px;
      background: rgba(10, 11, 16, 0.6);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      z-index: 3;
    }

    /* Local Video Preview (Mini float window) */
    #localVideoBox {
      position: absolute;
      bottom: 100px; right: 24px;
      width: 180px;
      height: 135px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 45px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
      z-index: 5;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(6px) saturate(180%);
      -webkit-backdrop-filter: blur(6px) saturate(180%);
    }

    #localVideoBox:hover {
      transform: scale(1.05) translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Controls Bar */
    #controlsBar {
      height: 85px;
      background: rgba(10, 11, 16, 0.45);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      backdrop-filter: blur(6px) saturate(180%);
      -webkit-backdrop-filter: blur(6px) saturate(180%);
      box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.2);
    }

    .btn-control {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .btn-control:hover {
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
      transform: scale(1.08) translateY(-2px);
    }

    .btn-control.off {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(225, 29, 72, 0.25)) !important;
      color: #fda4af !important;
      border-color: rgba(244, 63, 94, 0.4) !important;
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
    }

    .btn-control.end-call {
      background: linear-gradient(135deg, #ff2244, #cc0033);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn-control.end-call:hover {
      background: linear-gradient(135deg, #ff3355, #dd1144);
      color: #fff;
      box-shadow: 0 8px 24px rgba(255, 34, 68, 0.4);
      transform: scale(1.08) translateY(-2px);
    }

    .btn-control.accept-call {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn-control.accept-call:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      transform: scale(1.08) translateY(-2px);
    }

    /* Screen Picker Styles */
    .screen-source-item {
      width: 180px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .screen-source-item:hover {
      border-color: rgba(14, 165, 233, 0.45);
      box-shadow: 0 12px 35px rgba(14, 165, 233, 0.25), inset 0 1px 0 rgba(255,255,255,0.15);
      transform: scale(1.05) translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Space Background Nebula (Astra Academy Style) -->
  <div class="space-background">
    <div class="sphere s1"></div>
    <div class="sphere s2"></div>
    <div class="sphere s3"></div>
    <div class="sphere s4"></div>
  </div>

  <!-- HEADER -->
  <div id="callHeader">
    <div class="call-title">
      <div class="pulse-dot"></div>
      <span id="callTypeTitle">SECURE P2P VIDEO CALL</span>
    </div>
    <div style="font-size: 11px; font-family: 'Orbitron'; color: var(--cyan); font-weight: bold;" id="callDuration">00:00</div>
  </div>

  <!-- STATUS/RINGING OVERLAY -->
  <div id="statusOverlay">
    <div class="avatar-large" id="statusAvatar">👤</div>
    <div class="caller-name" id="statusTargetName">Menghubungkan...</div>
    <div class="call-status-text" id="statusMessage">MENGHUBUNGKAN...</div>
  </div>

  <!-- PARTICIPANT GRID -->
  <div id="videoGrid"></div>

  <!-- FLOAT LOCAL VIDEO PREVIEW -->
  <div id="localVideoBox">
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="video-label" style="bottom: 5px; left: 5px; font-size: 9px; padding: 2px 6px;">Anda</div>
  </div>

  <!-- CONTROLS BAR -->
  <div id="controlsBar">
    <button class="btn-control" id="btnMute" onclick="toggleMute()" title="Bisukan Mikrofon">🎤</button>
    <button class="btn-control" id="btnVideo" onclick="toggleVideo()" title="Matikan Kamera">📷</button>
    <button class="btn-control" id="btnScreen" onclick="toggleScreenShare()" title="Bagikan Layar">🖥️</button>
    
    <!-- Hang up button -->
    <button class="btn-control end-call" id="btnEndCall" onclick="endCall()" title="Akhiri Panggilan">📞</button>
  </div>

  <!-- SCREEN SHARE PICKER MODAL -->
  <div id="screenPickerModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(3, 2, 6, 0.7); z-index:9999; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(6px) saturate(180%); -webkit-backdrop-filter:blur(6px) saturate(180%); padding:20px;">
    <h2 style="font-family:'Plus Jakarta Sans'; font-size:18px; font-weight: 800; color:var(--cyan); margin-bottom:20px; letter-spacing:1px; text-transform:uppercase;">Pilih Layar / Jendela</h2>
    <div id="screenSourcesList" style="display:flex; flex-wrap:wrap; gap:15px; justify-content:center; max-width:800px; max-height:400px; overflow-y:auto; padding:10px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.01); width:100%;"></div>
    <div style="margin-top:20px; display:flex; gap:15px;">
      <button onclick="closeScreenPicker()" style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:#fff; padding:10px 24px; border-radius:10px; cursor:pointer; font-size:12px; font-weight:700; transition: all 0.2s;">BATAL</button>
    </div>
  </div>

  <!-- RINGTONE ASSETS -->
  <!-- Ringtone di-load dari sound generator berbasis Web Audio API di Javascript agar tidak ketergantungan file musik tambahan -->
  
  <!-- SCRIPT LAUNCHER -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js" type="module"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js" type="module"></script>
  <script src="call.js" type="module"></script>

</body>
</html>
